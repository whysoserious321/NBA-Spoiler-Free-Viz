<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>NBAViz 3P%</title>
  <meta name="description" content="Season 3-point shooting for every roster, with no scores, records, ratings or odds"/>
  <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)"/>
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)"/>
  <link rel="manifest" href="{{ url_for('static', filename='manifest-threes.json') }}"/>
  <link rel="icon" href="{{ url_for('static', filename='icons/icon.svg') }}" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="3P%"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}?v={{ v }}"/>
</head>
<body class="threes">
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/>
        </svg>
        <h1>3-point check</h1>
      </div>
      <button id="mode-pill" class="mode-pill" hidden aria-label="Change data: live, up to a date, or demo"></button>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div class="skeleton" aria-hidden="true"><div></div><div></div></div>
  </main>

  <nav class="tabbar" aria-label="Sections">
    <a href="/#ratings" data-tab="ratings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l3.5-4 3 2.5L20 7"/></svg>
      <span>Ratings</span>
    </a>
    <a href="/#leaders" data-tab="leaders">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-7h4v7M10 20V4h4v16M15 20v-10h4v10"/></svg>
      <span>Leaders</span>
    </a>
    <a href="/#mvp" data-tab="mvp">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>
      <span>MVP</span>
    </a>
    <a href="/#title" data-tab="title">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v4a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 13v4M8 20h8M10 17h4"/></svg>
      <span>Title</span>
    </a>
    <a href="/threes" class="ext" aria-current="page" title="Spoiler-free 3-point page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>
      <span>3P%</span>
    </a>
  </nav>

  <script src="{{ url_for('static', filename='gate.js') }}?v={{ v }}"></script>
  <script src="{{ url_for('static', filename='tpchart.js') }}?v={{ v }}"></script>
  <script src="{{ url_for('static', filename='threes.js') }}?v={{ v }}"></script>
</body>
</html>
